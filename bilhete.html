<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O seu bilhete — AYRE'S &amp; POSAP</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a005b">
<link rel="icon" href="img/ayres.jpg">
<link rel="stylesheet" href="estilo.css">
<style>
  .bilhete{background:linear-gradient(160deg,#1a1490,#0a005b);border:2px solid var(--ouro);border-radius:18px;padding:20px;text-align:center}
  #qr{background:#fff;padding:14px;border-radius:12px;display:inline-block;margin:12px 0}
  #qr img,#qr canvas{display:block}
  .dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin:14px auto 0;max-width:360px;font-size:.95rem}
  .dl dt{color:var(--txt2)}.dl dd{margin:0;font-weight:600}
  @media print{body{background:#fff}.naoimprimir{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap" style="padding-bottom:40px">
  <header class="topo">
    <div class="logos"><img src="img/ayres.jpg" alt="AYRE'S"><img src="img/posap.jpg" alt="POSAP"></div>
  </header>
  <div id="conteudo" class="card centro">A carregar…</div>
  <p class="centro naoimprimir"><a href="./">Voltar à página de bilhetes</a></p>
</div>
<script type="module">
import { db, doc, onSnapshot } from "./fb.js";
import { EVENTO, MBWAY, WHATSAPP, euro, descreverLugares, BILHETE_ARTE } from "./config.js";

const id = new URLSearchParams(location.search).get("id");
const box = document.getElementById("conteudo");
if (!id) box.textContent = "Link de bilhete inválido.";
else onSnapshot(doc(db, "bilhetes", id), s => {
  if (!s.exists()) { box.textContent = "Bilhete não encontrado."; return; }
  const b = s.data();
  const pessoas = b.lugares.length;
  const exp = b.expira?.toMillis?.() || 0;
  const estado = b.estado === "pendente" && exp < Date.now() ? "expirado" : b.estado;
  const det = `<dl class="dl">
      <dt>Código</dt><dd>${b.codigo}</dd>
      <dt>Nome</dt><dd>${esc(b.nome)}</dd>
      <dt>Lugares</dt><dd>${descreverLugares(b.lugares)}</dd>
      <dt>Pessoas</dt><dd>${pessoas}</dd>
      <dt>Valor</dt><dd>${euro(b.total)}</dd>
      <dt>Data</dt><dd>${EVENTO.data}</dd>
      <dt>Horário</dt><dd>Abertura ${EVENTO.abertura} · Início ${EVENTO.inicio}</dd>
      <dt>Local</dt><dd>${EVENTO.local}<br><span class="nota">${EVENTO.morada}</span></dd>
    </dl>`;
  if (estado === "pago") {
    box.className = "bilhete";
    box.innerHTML = `<span class="tag pago">PAGO</span>
      ${b.checkin ? `<p class="aviso" style="margin-top:10px">Entrada já registada.</p>` : ""}
      <img id="imgBilhete" alt="Bilhete com QR Code" style="width:100%;max-width:420px;border-radius:14px;margin:14px auto 0;display:block">
      <p class="nota" style="margin:8px 0 0">Apresente o QR Code na receção. Vale para ${pessoas} pessoa${pessoas > 1 ? "s" : ""}.</p>
      <a class="btn naoimprimir" id="btGuardar" download="bilhete-${b.codigo}.png" style="display:block;text-decoration:none;margin-top:12px">Guardar imagem do bilhete</a>
      ${det}`;
    desenharBilhete(b, location.origin + location.pathname + "?id=" + id).then(url => {
      document.getElementById("imgBilhete").src = url;
      document.getElementById("btGuardar").href = url;
    });
  } else if (estado === "pendente") {
    const msg = `Olá! Segue o comprovativo do MB WAY da reserva ${b.codigo} — ${euro(b.total)}.`;
    box.innerHTML = `<span class="tag pendente">A AGUARDAR PAGAMENTO</span>
      <p>Envie <b>${euro(b.total)}</b> por MB WAY para <b>${MBWAY}</b> com o código <b>${b.codigo}</b> na mensagem.</p>
      <a class="btn verde" style="display:block;text-decoration:none" target="_blank" rel="noopener"
        href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">Enviar comprovativo por WhatsApp</a>
      <p class="nota">Esta página atualiza sozinha quando o pagamento for confirmado. Guarde este link.</p>${det}`;
  } else {
    box.innerHTML = `<span class="tag ${estado}">${estado === "expirado" ? "RESERVA EXPIRADA" : "CANCELADA"}</span>
      <p>${estado === "expirado" ? "O prazo para pagamento terminou e os lugares foram libertados. Se já pagou, fale connosco." :
        "Esta reserva foi cancelada."}</p>
      <a class="btn verde" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}">Falar por WhatsApp</a>${det}`;
  }
}, () => box.textContent = "Não foi possível carregar o bilhete.");

// ---------- imagem do bilhete (arte + dados + QR) ----------
function carregar(src) {
  return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
}
async function desenharBilhete(b, link) {
  const A = BILHETE_ARTE, W = A.largura, H = A.altura;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const arte = await carregar(A.imagem);
  if (arte) g.drawImage(arte, 0, 0, W, H);
  else {                                    // fundo padrão
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#1a1490"); gr.addColorStop(1, "#0a005b");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const [l1, l2] = await Promise.all([carregar("img/ayres.jpg"), carregar("img/posap.jpg")]);
    const circ = (img, x) => { if (!img) return; g.save(); g.beginPath(); g.arc(x, 250, 140, 0, 7); g.clip();
      g.drawImage(img, x - 140, 110, 280, 280); g.restore(); };
    circ(l1, 370); circ(l2, 710);
    g.textAlign = "center"; g.fillStyle = "#f1d47a"; g.font = "800 110px Georgia, serif";
    g.fillText("ESTRELAS", W / 2, 560); g.fillText("DE NATAL", W / 2, 680);
    g.fillStyle = "#d8d4ff"; g.font = "500 44px system-ui, sans-serif";
    g.fillText("Espetáculo de Final de Ano", W / 2, 770);
    g.fillText("AYRE'S — Ginástica & Danças Aéreas", W / 2, 840);
    g.fillStyle = "#fbf7ec"; g.beginPath(); g.roundRect(60, A.zonaDados - 20, W - 120, H - A.zonaDados - 40, 40); g.fill();
  }
  // dados
  const y0 = A.zonaDados; g.textAlign = "center";
  g.fillStyle = A.corDestaque; g.font = "700 34px system-ui, sans-serif"; g.fillText("B I L H E T E", W / 2, y0 + 70);
  g.fillStyle = A.corTexto; g.font = "800 64px system-ui, sans-serif"; g.fillText(b.nome, W / 2, y0 + 150, W - 200);
  g.font = "700 44px system-ui, sans-serif"; g.fillText(descreverLugares(b.lugares), W / 2, y0 + 220, W - 160);
  g.font = "500 36px system-ui, sans-serif";
  g.fillText(`${b.lugares.length} pessoa${b.lugares.length > 1 ? "s" : ""} · Código ${b.codigo}`, W / 2, y0 + 278);
  g.fillText(EVENTO.data, W / 2, y0 + 330, W - 200);
  g.fillText(`Abertura ${EVENTO.abertura} · Início ${EVENTO.inicio}`, W / 2, y0 + 380, W - 200);
  // QR
  const tmp = document.createElement("div");
  new QRCode(tmp, { text: link, width: A.qr.tamanho, height: A.qr.tamanho, correctLevel: QRCode.CorrectLevel.M });
  const qc = tmp.querySelector("canvas");
  g.fillStyle = "#fff"; g.fillRect(A.qr.x - 16, A.qr.y - 16, A.qr.tamanho + 32, A.qr.tamanho + 32);
  g.drawImage(qc, A.qr.x, A.qr.y, A.qr.tamanho, A.qr.tamanho);
  g.fillStyle = A.corTexto; g.font = "500 28px system-ui, sans-serif";
  g.fillText(`${EVENTO.local} · ${EVENTO.morada}`, W / 2, A.qr.y + A.qr.tamanho + 62, W - 200);
  return c.toDataURL("image/png");
}

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
</script>
</body>
</html>
